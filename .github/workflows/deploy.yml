name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest. Does NOT cancel the in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit/integration tests
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build (base = /<repo>/, or / for user sites & custom domains)
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io || -f public/CNAME ]]; then
            VITE_BASE="/"
          else
            VITE_BASE="/$REPO/"
          fi
          echo "Building with VITE_BASE=$VITE_BASE"
          VITE_BASE="$VITE_BASE" npm run build
          echo "--- dist/index.html asset refs ---"
          grep -o 'src="[^"]*"\|href="[^"]*"' dist/index.html

      - name: SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
